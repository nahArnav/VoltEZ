name: VoltEZ CI

on:
  pull_request:
  push:
    branches: [main, final-frontend]

permissions:
  contents: read

concurrency:
  group: voltez-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-ml:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: voltez
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d voltez"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PROJECT_NAME: VoltEZ CI
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/voltez
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/voltez
      REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONPATH: .:backend:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-test.txt
          pip install -e . ruff
      - name: Compile and lint fatal Python errors
        run: |
          python -m compileall -q backend database src scripts
          ruff check --select E9,F63,F7,F82 backend database src scripts tests
      - name: Apply and verify database migrations
        run: |
          alembic upgrade head
          alembic check
      - name: Run ML and backend tests
        run: pytest -q tests backend/tests

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build production web bundle
        run: >-
          flutter build web --release
          --dart-define=API_BASE_URL=https://api.example.invalid/api/v1
          --dart-define=WS_BASE_URL=wss://api.example.invalid/api/v1
