version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: voltez-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voltez
    ports:
      - "5432:5432"
    volumes:
      - voltez_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voltez"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voltez-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - voltez_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  voltez_pg_data:
  voltez_redis_data:
