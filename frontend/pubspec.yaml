name: voltez_frontend
description: VoltEZ — Smart EV Charging Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # State management
  provider: ^6.1.5

  # Navigation
  go_router: ^14.8.1

  # Network
  dio: ^5.11.0
  web_socket_channel: ^3.0.3

  # Storage
  shared_preferences: ^2.5.5

  # Location
  geolocator: ^14.0.3
  geocoding: ^4.0.0

  # Maps (OpenStreetMap — no API key required)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Payments
  razorpay_flutter: ^1.4.0

  # UI
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Charts
  fl_chart: ^0.69.0

  # Backend (from final-frontend)
  http: ^1.2.0
  flutter_secure_storage: ^11.0.0
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
