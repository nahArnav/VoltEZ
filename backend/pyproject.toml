[project]
name = "voltez-ml"
version = "0.1.0"
description = "VoltEZ demand, availability, route-energy, waiting-time, and reliability ML package"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib>=1.4,<2",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "polars>=1.0,<2",
    "pyarrow>=17",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
    "scikit-learn>=1.6,<2",
]

[project.scripts]
voltez-generate = "voltez_ml.synthetic.cli:main"
voltez-build-features = "voltez_ml.features.cli:main"
voltez-plan-data = "voltez_ml.experiments.cli:main"
voltez-audit-rehearsal = "voltez_ml.experiments.rehearsal_cli:main"
voltez-build-feature-suite = "voltez_ml.features.suite_cli:main"
voltez-train-demand = "voltez_ml.training.demand_cli:main"
voltez-train-demand-window = "voltez_ml.training.demand_window_cli:main"
voltez-train-demand-hurdle-window = "voltez_ml.training.demand_hurdle_cli:main"
voltez-train-availability = "voltez_ml.training.availability_cli:main"
voltez-train-waiting-time = "voltez_ml.training.waiting_time_cli:main"
voltez-train-reliability = "voltez_ml.training.reliability_cli:main"
voltez-evaluate-demand = "voltez_ml.evaluation.demand_cli:main"
voltez-build-demand-contract = "voltez_ml.serving.demand_contract_cli:main"
voltez-build-availability-contract = "voltez_ml.serving.availability_contract_cli:main"
voltez-build-reliability-contract = "voltez_ml.serving.reliability_contract_cli:main"
voltez-build-waiting-time-contract = "voltez_ml.serving.waiting_time_contract_cli:main"
voltez-audit-demand-serving = "voltez_ml.serving.demand_audit_cli:main"
voltez-promote-demand-model = "voltez_ml.serving.promotion_cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "pandas-stubs>=2.3,<3",
    "types-pyyaml>=6.0,<7",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["voltez_ml"]
