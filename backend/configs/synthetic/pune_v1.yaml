synthetic:
  profile_name: pune_v1
  generator_version: v1.3
  start_date: 2026-01-01
  days: 90
  zone_count: 24
  business_count: 180
  charger_count: 240
  driver_count: 6000
  scenario_mix:
    normal_weekday: 0.58
    weekend_retail: 0.20
    monsoon_disruption: 0.08
    local_event_spike: 0.06
    outage_cluster: 0.04
    stale_status_reports: 0.04

  demand:
    average_requests_per_zone_per_day: 18.0
    negative_binomial_dispersion: 4.0
    spatial_spillover_weight: 0.15

  availability:
    base_operational_probability: 0.96
    owner_report_error_probability: 0.08
    user_report_error_probability: 0.04
    median_status_ttl_minutes: 30
    availability_tolerance_minutes: 10

  supply:
    minimum_ports_per_charger: 1
    maximum_ports_per_charger: 3

  behaviour:
    recommendations_per_request: 5
    selection_probability: 0.78
    cancellation_probability: 0.08
    no_show_probability: 0.07
    maximum_queue_wait_minutes: 45
    session_duration_log_sigma: 0.28

  route_energy:
    enabled: true
    maximum_candidate_snapshots_per_trip: 5
    coverage_trips_per_vehicle: 1
    profile_source_mix:
      catalogue: 0.72
      owner_declared: 0.18
      class_default: 0.10
    missing_elevation_probability: 0.08
    missing_weather_probability: 0.10
    steep_route_probability: 0.08

  safeguards:
    maximum_generated_rows: 5000000
    require_reproducible_manifest: true
    keep_latent_variables_out_of_features: true
