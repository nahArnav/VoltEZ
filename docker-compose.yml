services:
  db:
    image: postgis/postgis:17-3.5
    container_name: voltez_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - voltez_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: voltez_redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - voltez_redis_data:/data

    # Keep Redis in memory-first mode with optional persistence
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  voltez_postgres_data:
  voltez_redis_data:
