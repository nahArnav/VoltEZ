# ═════════════════════════════════════════════════════════════════════════════
# Render Web Service Blueprint (100% Free Tier - No Credit Card Required)
# Docs: https://render.com/docs/blueprint-spec
# ═════════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: voltez-api
    runtime: python
    buildCommand: bash build.sh

    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeploy: true
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: PROJECT_NAME
        value: VoltEZ API
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
