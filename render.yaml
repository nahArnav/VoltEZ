# ═════════════════════════════════════════════════════════════════════════════
# Render Web Service Blueprint (1 CPU / 2 GB production service)
# Docs: https://render.com/docs/blueprint-spec
# ═════════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: VoltEZ
    runtime: python
    region: singapore
    branch: final-frontend
    buildCommand: bash build.sh
    preDeployCommand: cd backend && alembic upgrade head
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health/live
    autoDeploy: true
    plan: 1c-2g
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: PROJECT_NAME
        value: VoltEZ API
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DB_POOL_SIZE
        value: 5
      - key: DB_MAX_OVERFLOW
        value: 5
      - key: DB_POOL_RECYCLE_SECONDS
        value: 240
      - key: DB_POOL_TIMEOUT_SECONDS
        value: 10
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: 10
      - key: WORKER_HEALTH_CHECK_KEY
        value: voltez:worker:health
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
